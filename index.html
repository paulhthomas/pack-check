<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="shopify-api-key" content="1d3b25975e68cf784d53798445b62883">
  <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  <title>Pack check</title>
  <style>
    :root {
      --ink: #17201d; --quiet: #5d6964; --line: #d9dfdc; --bg: #ffffff; --panel: #f4f6f5;
      --go: #13784a; --go-bg: #e3f4ea; --stop: #b42318; --stop-bg: #fdecea; --warn: #8a5a00; --warn-bg: #fff4d6;
      --btn: #17201d; --btn-ink: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #edf2ef; --quiet: #a6b2ad; --line: #36413d; --bg: #121816; --panel: #1b2320;
        --go: #5fd393; --go-bg: #12301f; --stop: #ff8a7e; --stop-bg: #3a1714; --warn: #f2c14e; --warn-bg: #352a0c;
        --btn: #edf2ef; --btn-ink: #121816;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px 12px 24px; font: 16px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
    h1 { font-size: 20px; margin: 4px 0 2px; }
    .sub { color: var(--quiet); font-size: 14px; margin: 0 0 12px; }
    button { font: inherit; font-weight: 600; border-radius: 10px; padding: 12px 14px; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); }
    button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
    button:disabled { opacity: .35; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; }
    .order { display: block; width: 100%; text-align: left; background: var(--panel); color: var(--ink); border: 1px solid var(--line); margin: 0 0 8px; font-weight: 400; }
    .order b { font-size: 17px; }
    .order .meta { color: var(--quiet); font-size: 14px; }
    .pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 2px; }
    .pill.warn { background: var(--warn-bg); color: var(--warn); }
    .pill.info { background: var(--panel); color: var(--quiet); border: 1px solid var(--line); }
    .banner { border-radius: 10px; padding: 12px; margin: 0 0 12px; font-size: 15px; }
    .banner.warn { background: var(--warn-bg); color: var(--warn); }
    .banner .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .banner .actions button { padding: 8px 12px; font-size: 14px; }
    .addr { background: var(--panel); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; font-size: 15px; }
    .line { display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px; border: 2px solid var(--line); border-radius: 12px; margin: 0 0 8px; }
    .line img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; background: var(--panel); }
    .line .name { font-weight: 600; }
    .line .variant { font-size: 20px; font-weight: 800; letter-spacing: .2px; }
    .line .small { font-size: 13px; color: var(--quiet); }
    .line .count { font-size: 22px; font-weight: 800; text-align: right; min-width: 52px; }
    .line.done { border-color: var(--go); background: var(--go-bg); }
    .line.done .count { color: var(--go); }
    .line.nobarcode { border-style: dashed; }
    .line .confirm { grid-column: 1 / -1; padding: 8px 12px; font-size: 14px; }
    .scanbar { position: sticky; top: 0; z-index: 5; margin: 0 -12px 12px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .scanbar .scanbtn { grid-column: 1 / -1; font-size: 18px; padding: 14px; }
    .scanbar #feedback { grid-column: 1 / -1; margin: 0; }
    .scanbar .row2 { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    input { font: inherit; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
    #feedback { border-radius: 10px; padding: 12px; margin: 0 0 12px; font-weight: 600; display: none; }
    #feedback.go { display: block; background: var(--go-bg); color: var(--go); }
    #feedback.stop { display: block; background: var(--stop-bg); color: var(--stop); }
    #feedback.warn { display: block; background: var(--warn-bg); color: var(--warn); }
    .empty { color: var(--quiet); padding: 24px 4px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .topbar button { padding: 8px 12px; font-size: 14px; }
    @media (prefers-reduced-motion: no-preference) { .line { transition: background .2s, border-color .2s; } }
  </style>
</head>
<body>
  <div id="app"><p class="empty">Loading orders…</p></div>
  <script src="app.js"></script>
</body>
</html>
